<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal da Mocidade Shoham — Estudos</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .study-card {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      cursor: pointer;
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--color-primary-soft);
      color: var(--color-primary-hover);
    }
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-5);
    }
  </style>
</head>
<body>
  <div class="page">
    <main class="container" style="max-width: 560px;">
      <div class="top-nav">
        <a href="dashboard.html" class="btn-ghost" style="text-decoration: none;">← Início</a>
        <h1 style="font-size: 1.25rem;">Estudos</h1>
        <button type="button" class="btn btn-primary hidden" id="new-btn" style="padding: 0 var(--space-3); min-height: 36px; font-size: 0.875rem;">
          + Novo
        </button>
      </div>

      <section id="list-view">
        <div id="list-loading" class="text-center text-muted">Carregando estudos...</div>
        <div id="list-empty" class="card text-center hidden">
          <p>📖</p>
          <p>Nenhum estudo publicado ainda.</p>
        </div>
        <div id="list" class="stack"></div>
      </section>

      <section id="detail-view" class="hidden stack">
        <button type="button" class="btn-ghost" id="back-to-list-btn" style="align-self: flex-start; padding: 0;">← Voltar</button>
        <div class="card stack">
          <span class="badge" id="detail-category"></span>
          <h2 id="detail-title" style="font-size: 1.25rem;"></h2>
          <p class="text-muted" id="detail-description"></p>
          <p id="detail-body" style="white-space: pre-wrap;"></p>
          <a id="detail-resource-link" class="btn btn-primary btn-block hidden" target="_blank" rel="noopener">Abrir material</a>
        </div>
      </section>

      <section id="new-view" class="hidden stack">
        <button type="button" class="btn-ghost" id="back-from-new-btn" style="align-self: flex-start; padding: 0;">← Voltar</button>

        <form id="new-form" class="card stack">
          <div class="field">
            <label for="study-title">Título</label>
            <input type="text" id="study-title" required />
          </div>

          <div class="field">
            <label for="study-category">Categoria</label>
            <select id="study-category" required style="min-height: var(--tap-target); border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 0 var(--space-4);"></select>
          </div>

          <div class="field">
            <label for="study-type">Tipo de conteúdo</label>
            <select id="study-type" required style="min-height: var(--tap-target); border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 0 var(--space-4);"></select>
          </div>

          <div class="field">
            <label for="study-description">Resumo (opcional)</label>
            <input type="text" id="study-description" />
          </div>

          <div class="field" id="body-field">
            <label for="study-body">Texto do estudo</label>
            <textarea id="study-body" rows="8" style="border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: var(--space-3);"></textarea>
            <span class="field-hint">Cole aqui o texto já revisado pela liderança.</span>
          </div>

          <div class="field hidden" id="resource-field">
            <label for="study-resource">Link do material</label>
            <input type="url" id="study-resource" placeholder="https://..." />
            <span class="field-hint">Link do PDF/vídeo (Google Drive, YouTube, Supabase Storage...).</span>
          </div>

          <div id="new-alert" class="alert alert-error hidden"></div>

          <button type="submit" class="btn btn-primary btn-block">Publicar</button>
        </form>
      </section>
    </main>
  </div>

  <script type="module">
    import { STUDY_CATEGORIES, CONTENT_TYPES, listStudies, getStudy, createStudy, isLeadership } from "./js/estudos.js";
    import { getAuthenticatedPhone } from "./js/cadastro.js";

    const listView = document.getElementById("list-view");
    const detailView = document.getElementById("detail-view");
    const newView = document.getElementById("new-view");
    const listLoading = document.getElementById("list-loading");
    const listEmpty = document.getElementById("list-empty");
    const listEl = document.getElementById("list");
    const newBtn = document.getElementById("new-btn");

    function showView(view) {
      listView.classList.toggle("hidden", view !== "list");
      detailView.classList.toggle("hidden", view !== "detail");
      newView.classList.toggle("hidden", view !== "new");
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function typeLabel(value) {
      return CONTENT_TYPES.find((t) => t.value === value)?.label || value;
    }

    async function renderList() {
      listLoading.classList.remove("hidden");
      listEmpty.classList.add("hidden");
      listEl.innerHTML = "";

      const items = await listStudies();
      listLoading.classList.add("hidden");

      if (items.length === 0) {
        listEmpty.classList.remove("hidden");
        return;
      }

      for (const item of items) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "study-card";
        btn.innerHTML = `
          <span class="badge">${item.category} · ${typeLabel(item.content_type)}</span>
          <div style="font-weight: 600; margin-top: 8px;">${escapeHtml(item.title)}</div>
        `;
        btn.addEventListener("click", () => openDetail(item.id));
        listEl.appendChild(btn);
      }
    }

    async function openDetail(id) {
      const study = await getStudy(id);
      if (!study) return;

      document.getElementById("detail-category").textContent = `${study.category} · ${typeLabel(study.content_type)}`;
      document.getElementById("detail-title").textContent = study.title;
      document.getElementById("detail-description").textContent = study.description || "";
      document.getElementById("detail-description").classList.toggle("hidden", !study.description);
      document.getElementById("detail-body").textContent = study.body_text || "";
      document.getElementById("detail-body").classList.toggle("hidden", !study.body_text);

      const link = document.getElementById("detail-resource-link");
      link.classList.toggle("hidden", !study.resource_url);
      if (study.resource_url) link.href = study.resource_url;

      showView("detail");
    }

    document.getElementById("back-to-list-btn").addEventListener("click", () => showView("list"));

    const categorySelect = document.getElementById("study-category");
    for (const cat of STUDY_CATEGORIES) {
      const opt = document.createElement("option");
      opt.value = cat;
      opt.textContent = cat;
      categorySelect.appendChild(opt);
    }

    const typeSelect = document.getElementById("study-type");
    for (const t of CONTENT_TYPES) {
      const opt = document.createElement("option");
      opt.value = t.value;
      opt.textContent = t.label;
      typeSelect.appendChild(opt);
    }

    const bodyField = document.getElementById("body-field");
    const resourceField = document.getElementById("resource-field");
    function updateFieldsForType() {
      const isTexto = typeSelect.value === "texto";
      bodyField.classList.toggle("hidden", !isTexto);
      resourceField.classList.toggle("hidden", isTexto);
    }
    typeSelect.addEventListener("change", updateFieldsForType);
    updateFieldsForType();

    newBtn.addEventListener("click", () => showView("new"));
    document.getElementById("back-from-new-btn").addEventListener("click", () => showView("list"));

    document.getElementById("new-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const alertEl = document.getElementById("new-alert");
      alertEl.classList.add("hidden");

      const result = await createStudy({
        title: document.getElementById("study-title").value,
        category: categorySelect.value,
        contentType: typeSelect.value,
        description: document.getElementById("study-description").value,
        bodyText: document.getElementById("study-body").value,
        resourceUrl: document.getElementById("study-resource").value,
      });

      if (!result.success) {
        alertEl.textContent = result.error;
        alertEl.classList.remove("hidden");
        return;
      }

      document.getElementById("new-form").reset();
      updateFieldsForType();
      showView("list");
      await renderList();
    });

    async function init() {
      const phone = await getAuthenticatedPhone();
      if (!phone) {
        window.location.replace("index.html");
        return;
      }

      newBtn.classList.toggle("hidden", !(await isLeadership()));
      await renderList();
    }

    init();
  </script>
</body>
</html>
